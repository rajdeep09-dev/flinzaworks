<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice">
  <!--
    The hero visual, as vector.

    One file, two kilobytes, and it stays sharp at every device pixel ratio and every width —
    which is why it is an SVG and not a photograph. The reference the client sent was a raster
    silhouette against a radial bloom; this is the same image rebuilt from three primitives so the
    site never ships a megabyte of hero art that has to be re-cropped per breakpoint.

    The blur is baked in with feGaussianBlur rather than left to a CSS `filter: blur()`. That
    matters: a CSS filter on a full-viewport layer is re-evaluated by the compositor every frame it
    is visible, whereas a blur applied inside an SVG is rasterised once and then composited as a
    flat bitmap. Same picture, none of the per-frame cost.

    Nothing here is brand copy. The wordmark is HTML in the hero, above this layer, so it stays
    selectable, indexable and legible to a screen reader.
  -->
  <defs>
    <linearGradient id="hg-base" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#f4fbfd"/>
      <stop offset="0.42" stop-color="#e4f3f9"/>
      <stop offset="1" stop-color="#c4e6f1"/>
    </linearGradient>

    <radialGradient id="hg-bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.36" stop-color="#ffffff" stop-opacity="0.86"/>
      <stop offset="0.68" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="hg-lobe-a" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#48b3ce" stop-opacity="0.62"/>
      <stop offset="0.6" stop-color="#48b3ce" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#48b3ce" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="hg-lobe-b" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1b7c96" stop-opacity="0.55"/>
      <stop offset="0.62" stop-color="#1b7c96" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1b7c96" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="hg-dark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#26697d" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#26697d" stop-opacity="0"/>
    </radialGradient>

    <filter id="hg-figure" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <filter id="hg-haze" x="-55%" y="-55%" width="210%" height="210%">
      <feGaussianBlur stdDeviation="64"/>
    </filter>
  </defs>

  <!-- Ground -->
  <rect width="1440" height="900" fill="url(#hg-base)"/>

  <!-- Haze: two aqua lobes so the frame is not a flat tint, and two quiet dark corners echoing the
       camo palette the rest of the site paints with. -->
  <g filter="url(#hg-haze)">
    <ellipse cx="176" cy="112" rx="520" ry="400" fill="url(#hg-lobe-a)"/>
    <ellipse cx="1290" cy="806" rx="560" ry="440" fill="url(#hg-lobe-b)"/>
    <ellipse cx="128" cy="64" rx="400" ry="280" fill="url(#hg-dark)" opacity="0.75"/>
    <ellipse cx="1402" cy="150" rx="320" ry="270" fill="url(#hg-dark)" opacity="0.6"/>
  </g>

  <!-- The light. This is what the figure is standing in front of. -->
  <ellipse cx="706" cy="404" rx="548" ry="418" fill="url(#hg-bloom)"/>
  <ellipse cx="706" cy="332" rx="404" ry="330" fill="#ffffff" opacity="0.72" filter="url(#hg-haze)"/>

  <!-- The figure: head, neck and shoulders, blurred into one soft mass and anchored below the
       bottom edge so it reads as someone rising through the light rather than a portrait. -->
  <g filter="url(#hg-figure)" fill="#0b1c24" opacity="0.96">
    <ellipse cx="720" cy="316" rx="58" ry="76"/>
    <rect x="688" y="380" width="64" height="78" rx="28"/>
    <path d="M548 906 C548 636 612 466 720 450 C828 466 892 636 892 906 Z"/>
  </g>

  <!-- A thin warm rim on the right of the torso, so the silhouette is separated from the bloom
       instead of sinking into it. -->
  <g filter="url(#hg-figure)" opacity="0.22">
    <path d="M812 906 C812 686 792 520 726 462 C840 486 892 646 892 906 Z" fill="#bdeaf2"/>
  </g>
</svg>
